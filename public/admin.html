<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders — CosmicMuse</title>
<meta name="theme-color" content="#0B0908">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header data-nav></header>
<main id="main">
  <section class="phead">
    <div class="wrap">
      <p class="crumbs"><a href="/">Home</a> &nbsp;/&nbsp; Orders</p>
      <h1 class="display d-lg">Order Desk</h1>
      <p class="lede">Everything placed through the store, straight from the database.</p>
    </div>
  </section>
  <section class="section" style="padding-top:1rem">
    <div class="wrap">
      <div class="stats" data-stats></div>
      <h2 class="display d-sm" style="margin:0 0 1.2rem">Orders</h2>
      <div class="tbl-wrap"><table class="tbl" data-orders><tbody><tr><td class="muted">Loading…</td></tr></tbody></table></div>
      <h2 class="display d-sm" style="margin:3.2rem 0 1.2rem">Stock</h2>
      <div class="tbl-wrap"><table class="tbl" data-stock></table></div>
    </div>
  </section>
</main>
<footer data-footer></footer>
<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
