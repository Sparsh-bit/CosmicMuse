name = "cosmicmuse"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# `binding = "DB"` is what functions/_lib code reads as `env.DB`; renaming it
# means updating every function file too.
[[d1_databases]]
binding = "DB"
database_name = "cosmicmuse"
database_id = "eba8f268-367e-445a-8991-cd4650fb8c13"
migrations_dir = "migrations"
